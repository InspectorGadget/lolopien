services:
  postgres:
    image: postgres:16-alpine
    container_name: lolopien-db
    environment:
      POSTGRES_USER: lolopien
      POSTGRES_PASSWORD: lolopien
      POSTGRES_DB: lolopien
    ports:
      - "5432:5432"
    volumes:
      - lolopien_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolopien -d lolopien"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lolopien_pgdata:
